- name: Set fact letsencrypt_certs
  set_fact:
    letsencrypt_certs: "{{ custom_domains_cmd.stdout|from_json }}"
  tags:
    - custom_domains
    - custom_domains:get_domains

- name: Print letsencrypt_certs
  debug:
    var: letsencrypt_certs
  tags:
    - custom_domains
    - custom_domains:debug

