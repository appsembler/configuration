- name: Include edxapp vars
  include_vars:
    file: ../../edxapp/defaults/main.yml
  tags:
    - custom_domains
    - custom_domains:get_domains

- debug:
    var: edxapp_venv_bin
- debug:
    var: EDXAPP_SETTINGS
- debug:
    var: edxapp_code_dir
- debug:
    var: groups
    
- name: Fetch custom domains list
  become_user: "{{ edxapp_user }}"
  django_manage: >
    command="lms custom_domains_list"
    app_path="{{ edxapp_code_dir }}"
    settings="{{ EDXAPP_SETTINGS }}"
    pythonpath="{{ edxapp_code_dir }}"
    virtualenv="{{ edxapp_venv_dir }}"
  register: custom_domains_cmd
  run_once: True
  delegate_to: "{{ groups['edx'][1] }}"
  tags:
    - custom_domains
    - custom_domains:get_domains

- debug:
    var: custom_domains_cmd

# - name: "Fetch custom domains list"
